<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>冠成企劃書資料夾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: case file — step rail on the left (top strip on phones), one form section at a time, sticky export bar */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1e2a36; --muted:#5f6b78; --line:#dde1e6; --soft:#eef0f3;
  --brand:#b47d17; --brand-ink:#ffffff; --brand-soft:#f8eed8; --bad:#b3261e; --bad-soft:#fbe9e7; --ok:#2f6b3a; --ok-soft:#e5f1e6; --focus:#1e2a36;
  --display:"Noto Serif TC","PMingLiU",serif; --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171c; --panel:#1b2129; --ink:#e7eaee; --muted:#9ba5b1; --line:#2f3742; --soft:#232a33;
  --brand:#e3a42b; --brand-ink:#1b1408; --brand-soft:#3a2f17; --bad:#ff8a80; --bad-soft:#3a2120; --ok:#8fd19a; --ok-soft:#1e3324; --focus:#e3a42b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171c; --panel:#1b2129; --ink:#e7eaee; --muted:#9ba5b1; --line:#2f3742; --soft:#232a33;
  --brand:#e3a42b; --brand-ink:#1b1408; --brand-soft:#3a2f17; --bad:#ff8a80; --bad-soft:#3a2120; --ok:#8fd19a; --ok-soft:#1e3324; --focus:#e3a42b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;padding-top:20px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.side{position:static}}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:.04em;display:block}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.16em}
.steps{display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.steps button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font:inherit;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.steps button[aria-current="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.steps .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted)}
.steps .dot.ok{background:var(--ok-soft);color:var(--ok)} .steps .dot.bad{background:var(--bad-soft);color:var(--bad)}
.filebtns{display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.filebtns{flex-direction:row;flex-wrap:wrap}}
main{min-width:0}
section.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.03em}
.lead{color:var(--muted);margin:-6px 0 0;max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted)}
label.f.req>span::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;line-height:1.6}
button{font:inherit}
.btn{font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.small{padding:3px 8px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:500;background:var(--soft)}
td input,td select{padding:5px 6px;font-size:15px}
td.num{text-align:right;white-space:nowrap;padding-top:10px}
tfoot td{font-weight:700;background:var(--soft)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px}
.msg{border-radius:8px;padding:8px 12px;font-size:15px}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.tip{background:var(--brand-soft);color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:15px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* sites */
.sites{display:flex;flex-direction:column;gap:16px}
.site{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
@media (max-width:980px){.site{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:#f0f1f3;border-radius:8px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center;touch-action:none}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:30px;text-align:center}
.tools{display:flex;flex-direction:column;gap:10px;min-width:0}
.tools .lbl{font-size:14px;color:var(--muted);font-weight:500}
.kinds{display:flex;flex-wrap:wrap;gap:5px}
.kinds button{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:3px 8px;font-size:14px;cursor:pointer}
.kinds button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand);border-color:var(--brand)}
.kinds i{width:12px;height:12px;border-radius:3px;display:inline-block}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.barin{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.barin .sum{margin-right:auto;font-size:15px;color:var(--muted)}
.barin .sum b{color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cl li{border-top:1px solid var(--line)} .cl li:first-child{border-top:0}
.cl label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer}
.cl input{width:17px;height:17px;margin-top:3px;flex:none;accent-color:var(--brand)}
.cl small{display:block;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
<aside class="side">
  <div class="brand"><b>企劃書資料夾</b><small>冠成家電 · 企劃書案件頁產生器</small></div>
  <nav class="steps" id="steps" aria-label="步驟"></nav>
  <div class="filebtns">
    <button class="btn" id="saveJson">匯出企劃書檔（.json）</button>
    <label class="btn" style="text-align:center">匯入企劃書檔<input type="file" id="loadJson" accept=".json,application/json" hidden></label>
    <button class="btn" id="newCase">開新案件</button>
    <div class="msg bad" id="newConfirm" hidden>清除目前所有資料？<div class="row" style="margin-top:6px"><button class="btn small primary" id="newYes">清除</button><button class="btn small" id="newNo">取消</button></div></div>
  </div>
</aside>

<main id="main"></main>
</div>

<div class="bar"><div class="barin">
  <span class="sum" id="sumLine"></span>
  <span class="msg" id="exportMsg" hidden></span>
  <button class="btn primary" id="exportBtn">轉出案件頁 PPT</button>
</div></div>

function quoteTotals(){const sub=C.quote.reduce((a,q)=>a+num(q.qty)*num(q.price),0),tax=Math.round(sub*0.05);return{sub,tax,total:sub+tax};}

const STEPS=[["info","基本資料"],["rubric","評選項目"],["brand","投標品牌"],["sched","履約期程"],["sites","現場施工圖"],["quote","報價明細"],["feedback","創意回饋"],["check","檢查與轉出"]];
let cur="info";try{cur=localStorage.getItem("kc-case-step")||"info";}catch(e){}
function renderSteps(){const I=issues();
  $("steps").innerHTML=STEPS.map(([k,n],i)=>{const bad=I.some(x=>x.step===k&&x.level==="bad"),warn=I.some(x=>x.step===k);
    return `<button data-step="${k}" aria-current="${k===cur}"><span class="dot ${bad?"bad":warn?"":"ok"}">${bad?"!":warn?i+1:"✓"}</span>${n}</button>`}).join("");}
function renderSum(){const I=issues(),bad=I.filter(x=>x.level==="bad").length,warn=I.length-bad,t=quoteTotals();
  $("sumLine").innerHTML=`${esc(C.info.caseName||"未命名案件")}　｜　總價 <b>${money(t.total)}</b>　｜　${bad?`<b style="color:var(--bad)">${bad} 項必改</b>`:"<b style='color:var(--ok)'>必填完成</b>"}${warn?`、${warn} 項提醒`:""}${saveWarn?"　｜　<b style='color:var(--bad)'>瀏覽器無法暫存資料（照片太多或已封鎖儲存），請記得匯出企劃書檔</b>":""}`;
  renderSteps();}
function stepMsgs(k){const I=issues().filter(x=>x.step===k);return I.length?`<div class="msgs">${I.map(x=>`<div class="msg ${x.level==="bad"?"bad":"tip"}">${esc(x.text)}</div>`).join("")}</div>`:`<div class="msg ok">這一步沒有問題</div>`;}

function field(path,label,opts={}){const [g,k]=path.split(".");const v=C[g][k]??"";
  if(opts.select)return `<label class="f${opts.req?" req":""}"><span>${label}</span><select id="f-${k}" data-path="${path}">${opts.select.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select></label>`;
  return `<label class="f${opts.req?" req":""}"><span>${label}</span><input id="f-${k}" data-path="${path}" type="${opts.type||"text"}" value="${esc(v)}" placeholder="${esc(opts.ph||"")}"></label>`;}

/* ---------------- site annotator ---------------- */
let tool={site:null,mode:"label",kind:"indoor",draft:null};
function siteCard(s,k){
  const ratio=s.h&&s.w?s.h/s.w:0.66;
  return `<div class="site" data-site="${k}">
   <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
    <div class="grid" style="grid-template-columns:minmax(0,1fr) auto"><input id="st-p-${k}" data-arr="sites" data-i="${k}" data-k="place" value="${esc(s.place)}" placeholder="位置，例：E棟 2F 3年8班" aria-label="位置名稱"><button class="x" data-del="sites" data-i="${k}" aria-label="刪除這個施工點">刪除</button></div>
    <div class="stage" id="stage-${k}">${s.img?`<img src="${s.img}" alt="${esc(s.place)} 現場照片" draggable="false"><svg viewBox="0 0 1000 ${Math.round(1000*ratio)}" data-svg="${k}">${annSVG(s)}</svg>`
      :`<label class="drop"><span>上傳師傅拍的現場照片</span><span class="btn">選擇照片</span><input type="file" accept="image/*" data-upload="${k}" hidden></label>`}</div>
    ${s.img?`<div class="row"><label class="btn small">換照片<input type="file" accept="image/*" data-upload="${k}" hidden></label><button class="btn small" data-undo="${k}">復原上一步</button><button class="btn small" data-clear="${k}">清除標註</button></div>`:""}
   </div>
   <div class="tools">
    <span class="lbl">工具</span>
    <div class="row">${[["label","標註點"],["line","畫管線"],["rect","框位置"],["erase","刪除標註"]].map(([m,n])=>`<button class="btn small" data-mode="${m}" data-for="${k}" aria-pressed="${tool.site===k&&tool.mode===m||tool.site!==k&&m==="label"}">${n}</button>`).join("")}</div>
    ${(()=>{const m=tool.site===k?tool.mode:"label";if(m==="erase")return `<span class="hint" style="font-size:14px;color:var(--muted)">點一下照片上的標註就會刪除</span>`;
      const list=KINDS[m];const kd=tool.site===k&&list.some(x=>x[0]===tool.kind)?tool.kind:list[0][0];
      return `<span class="lbl">類型</span><div class="kinds">${list.map(([id,n,c])=>`<button data-kind="${id}" data-for="${k}" aria-pressed="${id===kd}"><i style="background:#${c}"></i>${n}</button>`).join("")}</div>
      ${m==="label"?`<input id="st-cl-${k}" placeholder="自訂文字（選「自訂」時使用）" data-customlabel="${k}" value="${esc(tool.custom||"")}">`:""}
      <span class="hint" style="font-size:14px;color:var(--muted)">${m==="line"?"在照片上逐點點擊畫出路徑，按「完成這條線」結束。":m==="rect"?"在照片上拖曳框出安裝位置。":"點一下照片放上標註。"}</span>
      ${m==="line"?`<button class="btn small primary" data-finish="${k}">完成這條線</button>`:""}`;})()}
    <span class="lbl">施工說明（會放在投影片右側）</span>
    <textarea id="st-n-${k}" data-arr="sites" data-i="${k}" data-k="notes" aria-label="施工說明">${esc(s.notes)}</textarea>
    <div class="row">${Object.keys(NOTE_SNIPPETS).map(n=>`<button class="btn small" data-snip="${n}" data-for="${k}">＋${n}說明</button>`).join("")}</div>
   </div></div>`;}
function annSVG(s){const H=Math.round(1000*(s.h/s.w||0.66));let o="";
  for(const [idx,a] of s.ann.entries()){const c="#"+KIND[a.kind].color;
    if(a.type==="line"){o+=`<polyline data-ann="${idx}" points="${a.pts.map(p=>`${p[0]*1000},${p[1]*H}`).join(" ")}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" ${a.kind!=="ref"?'stroke-dasharray="18 12"':""}/>`;}
    else if(a.type==="rect"){o+=`<rect data-ann="${idx}" x="${a.x*1000}" y="${a.y*H}" width="${a.w*1000}" height="${a.h*H}" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="6" rx="8"/>`;}
    else{const t=a.text||KIND[a.kind].name,x=a.x*1000,y=a.y*H,w=t.length*26+30;const lx=Math.min(x+14,1000-w-4),ly=Math.max(y-58,4);
      o+=`<g data-ann="${idx}"><circle cx="${x}" cy="${y}" r="11" fill="${c}" stroke="#fff" stroke-width="4"/><line x1="${x}" y1="${y}" x2="${lx+10}" y2="${ly+40}" stroke="${c}" stroke-width="4"/><rect x="${lx}" y="${ly}" width="${w}" height="44" rx="10" fill="${c}"/><text x="${lx+15}" y="${ly+31}" font-size="26" font-weight="700" fill="#fff" font-family="${FONT},sans-serif">${esc(t)}</text></g>`;}}
  if(tool.draft&&tool.draft.site===s){const d=tool.draft;const c="#"+KIND[d.kind].color;
    if(d.type==="line")o+=`<polyline points="${d.pts.map(p=>`${p[0]*1000},${p[1]*H}`).join(" ")}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" opacity=".7"/>${d.pts.map(p=>`<circle cx="${p[0]*1000}" cy="${p[1]*H}" r="9" fill="${c}"/>`).join("")}`;
    if(d.type==="rect"&&d.w)o+=`<rect x="${Math.min(d.x,d.x+d.w)*1000}" y="${Math.min(d.y,d.y+d.h)*H}" width="${Math.abs(d.w)*1000}" height="${Math.abs(d.h)*H}" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="12 8"/>`;}
  return o;}
function redrawSite(k){const svg=document.querySelector(`[data-svg="${k}"]`);if(svg)svg.innerHTML=annSVG(C.sites[k]);}
function ptFrom(e,svg){const r=svg.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];}
document.addEventListener("pointerdown",e=>{const svg=e.target.closest("svg[data-svg]");if(!svg)return;const k=+svg.dataset.svg,s=C.sites[k];
  const mode=tool.site===k?tool.mode:"label",kind=tool.site===k?tool.kind:KINDS[mode]?.[0]?.[0];tool.site=k;
  if(mode==="erase"){const g=e.target.closest("[data-ann]");if(g){s.ann.splice(+g.dataset.ann,1);save();redrawSite(k);}return;}
  const p=ptFrom(e,svg);
  if(mode==="label"){const t=kind==="custom"?(tool.custom||"自訂"):"";s.ann.push({type:"label",kind,x:p[0],y:p[1],text:t});save();redrawSite(k);}
  else if(mode==="line"){if(!tool.draft||tool.draft.site!==s)tool.draft={site:s,type:"line",kind,pts:[]};tool.draft.pts.push(p);redrawSite(k);}
  else if(mode==="rect"){tool.draft={site:s,type:"rect",kind,x:p[0],y:p[1],w:0,h:0};svg.setPointerCapture(e.pointerId);redrawSite(k);}
});
document.addEventListener("pointermove",e=>{const d=tool.draft;if(!d||d.type!=="rect")return;const svg=document.querySelector(`[data-svg="${tool.site}"]`);if(!svg)return;const p=ptFrom(e,svg);d.w=p[0]-d.x;d.h=p[1]-d.y;redrawSite(tool.site);});
document.addEventListener("pointerup",()=>{const d=tool.draft;if(!d||d.type!=="rect")return;if(Math.abs(d.w)>0.02&&Math.abs(d.h)>0.02){d.site.ann.push({type:"rect",kind:d.kind,x:Math.min(d.x,d.x+d.w),y:Math.min(d.y,d.y+d.h),w:Math.abs(d.w),h:Math.abs(d.h)});save();}
  tool.draft=null;redrawSite(tool.site);});
function finishLine(k){const d=tool.draft;if(d&&d.type==="line"&&d.site===C.sites[k]&&d.pts.length>1){C.sites[k].ann.push({type:"line",kind:d.kind,pts:d.pts});save();}tool.draft=null;redrawSite(k);renderSum();}
async function loadPhoto(file){const url=URL.createObjectURL(file);const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url;});
  const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  return {img:cv.toDataURL("image/jpeg",0.82),w,h};}

/* ---------------- render + events ---------------- */
function render(){$("main").innerHTML=`<section class="step" aria-labelledby="h-${cur}">${VIEWS[cur]().replace("<h1>",`<h1 id="h-${cur}">`)}</section>`;renderSum();}
function go(k){cur=k;tool.draft=null;try{localStorage.setItem("kc-case-step",k);}catch(e){}render();scrollTo({top:0});}
document.addEventListener("click",async e=>{const t=e.target.closest("button,[data-step]");if(!t)return;const d=t.dataset;
  if(d.step){go(d.step);return;}
  if(d.add){const row={rubric:{name:"",pts:"",ch:CHAPTERS[0],pg:""},sched:{t:"",a:"",b:""},quote:{name:"",spec:"",qty:"",unit:"台",price:"",note:""},feedback:{title:"",desc:""}}[d.add];C[d.add].push(row);save();render();return;}
  if(d.del){C[d.del].splice(+d.i,1);save();render();return;}
  if(d.preset){C.rubric=RUBRIC_PRESETS[d.preset].map(([name,pts,ch])=>({name,pts,ch,pg:""}));save();render();return;}
  if(d.brand){C.brand=d.brand;save();render();return;}
  if(d.mode){tool.site=+d.for;tool.mode=d.mode;tool.kind=d.mode==="erase"?null:KINDS[d.mode][0][0];tool.draft=null;render();return;}
  if(d.kind){tool.site=+d.for;tool.kind=d.kind;render();return;}
  if(d.finish!==undefined){finishLine(+d.finish);return;}
  if(d.undo!==undefined){C.sites[+d.undo].ann.pop();save();redrawSite(+d.undo);renderSum();return;}
  if(d.clear!==undefined){C.sites[+d.clear].ann=[];save();redrawSite(+d.clear);renderSum();return;}
  if(d.snip){const s=C.sites[+d.for];s.notes=(s.notes?s.notes+"\n":"")+NOTE_SNIPPETS[d.snip];save();render();return;}
  if(t.id==="addSite"){C.sites.push({place:"",img:"",w:0,h:0,ann:[],notes:""});save();render();return;}
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;

document.addEventListener("change",async e=>{const t=e.target,d=t.dataset;

function alertMsg(t,ok){const m=$("exportMsg");m.textContent=t;m.className="msg "+(ok?"ok":"bad");m.hidden=false;clearTimeout(m._t);m._t=setTimeout(()=>m.hidden=true,6000);}

/* ---------------- file save / load ---------------- */
let DL=null;(async()=>{try{DL=window.claude?await window.claude.use("downloads"):null;}catch(e){DL=null;}})();
function plainDownload(filename,data){ // GitHub Pages / any normal browser
  const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".json")?"application/json":"application/octet-stream"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);alertMsg("已下載 "+filename,true);return true;}
async function offer(filename,data){
  if(!DL)return plainDownload(filename,data);
  try{await DL.save({filename,data});alertMsg("已下載 "+filename,true);return true;}
  catch(e){alertMsg(e&&e.code==="declined"?"已取消下載":e&&e.code==="rate_limited"?"另一個下載還在確認，請稍候":"下載失敗："+(e&&e.message||"請再試一次"));return false;}}
$("saveJson").onclick=()=>offer(`企劃書資料夾_${(C.info.caseNo||"未命名").replace(/[\\/:*?"<>|【】]/g,"")}.json`,JSON.stringify(C));
$("loadJson").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.info||!Array.isArray(d.sites))throw 0;C=Object.assign(blank(),d);save();go("info");alertMsg("已匯入 "+f.name,true);}catch(err){alertMsg("這個檔案不是企劃書檔");}e.target.value="";};

$("newYes").onclick=()=>{C=blank();save();$("newConfirm").hidden=true;go("info");};

async function stripFolders(blob){ // folder entries in the zip can upset OneDrive / SharePoint co-editing
  if(!window.JSZip)return blob;try{const z=await JSZip.loadAsync(blob);Object.keys(z.files).forEach(k=>{if(z.files[k].dir)delete z.files[k];});
  return await z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation",compression:"DEFLATE"});}catch(e){return blob;}}
window.__strip=stripFolders;
let pending=false;
$("exportBtn").onclick=async()=>{
  const bad=issues().filter(x=>x.level==="bad");
  if(bad.length&&!pending){pending=true;alertMsg(`還有 ${bad.length} 項必改（例：${bad[0].text}）。再按一次仍會轉出。`);setTimeout(()=>pending=false,6000);return;}
  pending=false;
  if(!window.PptxGenJS){alertMsg("PPT 產生工具沒有載入，請重新整理頁面");return;}
  const b=$("exportBtn");b.disabled=true;b.textContent="產生中…";
  try{const P=buildPptx();let blob=await P.write({outputType:"blob"});blob=await stripFolders(blob);
    await offer(`${(C.info.org||"案件").replace(/[\\/:*?"<>|【】]/g,"")}_案件頁.pptx`,blob);}
  catch(err){alertMsg("產生失敗："+(err&&err.message||err));}
  b.disabled=false;b.textContent="轉出案件頁 PPT";
};
